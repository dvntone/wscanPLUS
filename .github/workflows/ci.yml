name: Agent Guarded CI

"on":
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  nodejs:
    name: Node.js (via .nvmrc preferred, fallback 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check for Node.js project files
        id: check_nodejs
        run: |
          if [ -f "desktop/package.json" ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            if [ -f "desktop/package-lock.json" ]; then
              echo "Found desktop/package.json and desktop/package-lock.json; will use npm ci"
            else
              echo "Found desktop/package.json but no desktop/package-lock.json; will fall back to npm install"
            fi
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Node.js build: no desktop/package.json found"
          fi

      - name: Setup Node.js from .nvmrc or fallback
        if: steps.check_nodejs.outputs.has_package_json == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          node-version: 22.x
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Show Node version
        if: steps.check_nodejs.outputs.has_package_json == 'true'
        run: node --version

      - name: Install dependencies
        if: steps.check_nodejs.outputs.has_package_json == 'true'
        working-directory: desktop
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Using npm ci (package-lock.json found)"
            npm ci
          else
            echo "Using npm install (no package-lock.json found)"
            npm install
          fi

      - name: Lint
        if: steps.check_nodejs.outputs.has_package_json == 'true' && hashFiles('desktop/.eslintrc*', 'desktop/eslint.config.*') != ''
        working-directory: desktop
        run: npm run lint

      - name: Test
        if: steps.check_nodejs.outputs.has_package_json == 'true' && hashFiles('desktop/jest.config.*', 'desktop/**/*.test.[jt]s', 'desktop/**/*.spec.[jt]s') != ''
        working-directory: desktop
        run: npm test

  android:
    name: Android (JDK 17, Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check for gradlew
        id: check_gradlew
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Skipping Android build: android/gradlew not present"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_gradlew.outputs.skip != 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        if: steps.check_gradlew.outputs.skip != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        if: steps.check_gradlew.outputs.skip != 'true'
        working-directory: android
        run: chmod +x ./gradlew

      - name: Write mock google-services.json for CI
        if: steps.check_gradlew.outputs.skip != 'true'
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.wscanplus.app"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Android Unit Tests
        if: steps.check_gradlew.outputs.skip != 'true'
        working-directory: android
        run: ./gradlew :core:test :app:test

      - name: Kotlin Lint (ktlint)
        if: steps.check_gradlew.outputs.skip != 'true'
        working-directory: android
        run: ./gradlew :core:ktlintCheck :app:ktlintCheck

      - name: Android Build (assembleDebug)
        if: steps.check_gradlew.outputs.skip != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      # Upload debug APK so successful CI runs produce an installable artifact
      # for mobile/device smoke testing without requiring a local SDK build.
      - name: Upload APK Artifact
        if: steps.check_gradlew.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wscanplus-debug-apk-ci-mock
          path: android/app/build/outputs/apk/debug/app-debug.apk

  branch-name:
    name: Branch name lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check agent prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if echo "$BRANCH" | grep -qE '^(claude|copilot|gpt|codex|dvntone)/'; then
            echo "Branch name OK: $BRANCH"
          else
            echo "ERROR: Branch '$BRANCH' does not start with an approved agent prefix."
            echo "Allowed prefixes: claude/, copilot/, gpt/, codex/, dvntone/"
            exit 1
          fi

  pr-issue-ref:
    name: PR issue reference check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check for closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "ERROR: PR body is empty. Add a description with a closing keyword."
            exit 1
          fi
          if echo "$PR_BODY" | grep -qiE '(closes|fixes|resolves) #[0-9]+'; then
            echo "Issue reference found."
          else
            echo "ERROR: PR body must reference a GitHub Issue (e.g. 'Closes #123')."
            exit 1
          fi

  pr-wip-check:
    name: WIP title guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check for WIP in title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qiE '^(\[WIP\]|WIP[: ])'; then
            echo "ERROR: PR title starts with WIP. Mark as draft or rename before review."
            exit 1
          fi
          echo "Title OK: $PR_TITLE"

  pr-size:
    name: PR size check (max 200 LOC, tests excluded)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Count changed lines via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --paginate \
            --jq '[.[] | select(.filename | test("Test|Spec|\\.test\\.|\\.spec\\.") | not) | (.additions + .deletions)] | add // 0')
          echo "Changed lines (tests excluded): $CHANGED"
          if [ "$CHANGED" -gt 200 ]; then
            echo "ERROR: PR changes $CHANGED lines (limit 200 LOC, tests excluded)."
            echo "Split into smaller PRs or justify the size in the PR description."
            exit 1
          fi
          echo "Size OK: $CHANGED lines"

  pr-simultaneous:
    name: Simultaneous PR check (max 2 open)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    timeout-minutes: 5
    steps:
      - name: Check open PR count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=10" \
            --jq 'length')
          echo "Open PRs: $OPEN"
          if [ "$OPEN" -gt 2 ]; then
            echo "ERROR: $OPEN PRs are open simultaneously. Maximum is 2."
            echo "Close or merge existing PRs before opening another."
            exit 1
          fi
          echo "OK: $OPEN open PR(s)"

  secret-scan:
    name: Secret Scan (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Scan for accidental secrets
        run: |
          if grep -rIl \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.example' \
            --exclude='secrets.defaults.*' \
            --exclude='SECRETS.md' \
            --exclude='SECURITY.md' \
            --exclude='KNOWN_ISSUES.md' \
            -E 'AKIA[0-9A-Z]{16}|AIzaSy[0-9A-Za-z_-]{33}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|-----BEGIN PGP PRIVATE KEY BLOCK-----|-----BEGIN (CERTIFICATE|X509 CERTIFICATE|TRUSTED CERTIFICATE)-----|ghp_[0-9A-Za-z]{36}|ghs_[0-9A-Za-z]{36}' \
            .; then
            echo "ERROR: Potential secrets detected. Review the files above before merging."
            exit 1
          else
            echo "No secrets detected."
          fi

# Guardrails: No deploy/merge/trigger jobs. No auto pushes.
# Only triggers on PRs or non-main branch pushes.
# All failures must be resolved before merging — see docs/AGENTS.md.
