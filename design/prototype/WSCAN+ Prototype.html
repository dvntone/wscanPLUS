<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>wscan+ · Android Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>

  /* ── Phone frame ─────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; background: #07090c; }
  body { display: flex; align-items: center; justify-content: center; }
  .phone-wrap { width: 412px; height: 892px; border-radius: 38px; overflow: hidden;
    border: 8px solid rgba(80,90,110,0.5);
    box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative; flex-shrink: 0; }
  @media (max-height: 940px) {
    .phone-wrap { transform: scale(0.78); transform-origin: center center; }
  }
  @media (max-height: 760px) {
    .phone-wrap { transform: scale(0.62); transform-origin: center center; }
  }

/* tokens.css — wscan+ tactical operator tokens (from design/tokens/wscan.tokens.json) */

:root {
  /* Type */
  --ws-f-display: "Space Grotesk", "Inter Tight", system-ui, sans-serif;
  --ws-f-body: "Inter", "IBM Plex Sans", system-ui, sans-serif;
  --ws-f-mono: "JetBrains Mono", "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Spacing — from tokens */
  --ws-s-1: 4px;  --ws-s-2: 8px;  --ws-s-3: 12px;
  --ws-s-4: 16px; --ws-s-5: 20px; --ws-s-6: 24px; --ws-s-8: 32px;

  /* Radii */
  --ws-r-sm: 6px; --ws-r-md: 10px; --ws-r-lg: 14px; --ws-r-xl: 18px; --ws-r-pill: 999px;

  /* Motion */
  --ws-m-fast: 120ms; --ws-m-med: 200ms;

  /* Threat scale (anomaly confidence) */
  --ws-threat-low:      #2FBF71;
  --ws-threat-medium:   #F2B94B;
  --ws-threat-high:     #FF8A3D;
  --ws-threat-critical: #FF5A5F;

  /* RSSI */
  --ws-rssi-strong:   #2FBF71;
  --ws-rssi-moderate: #F2B94B;
  --ws-rssi-weak:     #FF8A3D;

  /* Accents */
  --ws-accent-scan:  #2AC3FF;
  --ws-accent-focus: #7C5CFF;
}

/* Dark — operator default */
[data-theme="dark"] {
  --ws-canvas:    #0B1220;
  --ws-panel:     #121A2B;
  --ws-panel-2:   #1A2336;
  --ws-panel-3:   #24324A;
  --ws-border:    #2A3850;
  --ws-border-2:  #42526B;
  --ws-console:   #05070B;
  --ws-text:      #D6DCE7;
  --ws-text-2:    #A4AFBF;
  --ws-text-3:    #6B7586;
  --ws-text-h:    #F2F5F9;
  --ws-grid:      rgba(42, 195, 255, 0.06);
  --ws-shadow:    0 12px 32px rgba(0,0,0,0.45);
}

/* Light — operator daylight mode */
[data-theme="light"] {
  --ws-canvas:    #F2F5F9;
  --ws-panel:     #FFFFFF;
  --ws-panel-2:   #ECEFF4;
  --ws-panel-3:   #DDE3EB;
  --ws-border:    rgba(11, 18, 32, 0.10);
  --ws-border-2:  rgba(11, 18, 32, 0.22);
  --ws-console:   #0E1422;
  --ws-text:      #1A2336;
  --ws-text-2:    #4B5668;
  --ws-text-3:    #7A8395;
  --ws-text-h:    #0B1220;
  --ws-grid:      rgba(11, 18, 32, 0.05);
  --ws-shadow:    0 12px 32px rgba(11, 18, 32, 0.10);

  --ws-threat-low:      #1AA361;
  --ws-threat-medium:   #C58E1A;
  --ws-threat-high:     #D86E1A;
  --ws-threat-critical: #D63A40;
}

/* App base */
.ws-app {
  background: var(--ws-canvas);
  color: var(--ws-text);
  font-family: var(--ws-f-body);
  font-size: 13px; line-height: 1.45;
  height: 100%; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

/* Utilities */
.ws-mono { font-family: var(--ws-f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.005em; }
.ws-display { font-family: var(--ws-f-display); letter-spacing: -0.015em; }
.ws-meta { font-family: var(--ws-f-mono); font-size: 10px; letter-spacing: 0.1em;
           text-transform: uppercase; color: var(--ws-text-2); font-weight: 500; }
.ws-num  { font-family: var(--ws-f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.ws-h    { color: var(--ws-text-h); }

.ws-card {
  background: var(--ws-panel);
  border: 1px solid var(--ws-border);
  border-radius: var(--ws-r-md);
}
.ws-card-2 {
  background: var(--ws-panel-2);
  border: 1px solid var(--ws-border);
  border-radius: var(--ws-r-md);
}

/* Chips */
.ws-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--ws-r-pill);
  background: var(--ws-panel-2);
  border: 1px solid var(--ws-border);
  font-family: var(--ws-f-mono);
  font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ws-text-2); font-weight: 500;
}
.ws-chip-on {
  background: var(--ws-accent-scan);
  border-color: transparent;
  color: var(--ws-canvas);
}

/* Threat pill — colored by --threat var */
.ws-threat-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 8px;
  border-radius: var(--ws-r-pill);
  font-family: var(--ws-f-mono);
  font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 600;
  color: var(--threat);
  background: color-mix(in oklab, var(--threat) 14%, transparent);
  border: 1px solid color-mix(in oklab, var(--threat) 35%, transparent);
}
.ws-threat-pill::before {
  content: ""; width: 6px; height: 6px;
  background: var(--threat); border-radius: 50%;
  box-shadow: 0 0 8px var(--threat);
}

/* Status bar */
.ws-statusbar {
  height: 36px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  color: var(--ws-text);
  font-size: 13px;
  flex-shrink: 0; position: relative; z-index: 5;
}
.ws-statusbar-pill {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: #1a1a1a;
}

/* Bottom gesture bar */
.ws-handle { height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ws-handle > div { width: 108px; height: 4px; background: var(--ws-text); opacity: 0.42; border-radius: 2px; }

/* Scroll */
.ws-scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
             scrollbar-color: var(--ws-border-2) transparent; }
.ws-scroll::-webkit-scrollbar { width: 4px; }
.ws-scroll::-webkit-scrollbar-thumb { background: var(--ws-border-2); border-radius: 2px; }

/* Buttons */
.ws-btn {
  appearance: none; font: inherit; cursor: pointer;
  border: 1px solid var(--ws-border-2);
  background: var(--ws-panel-2);
  color: var(--ws-text);
  border-radius: var(--ws-r-md);
  padding: 8px 14px;
  transition: background var(--ws-m-fast);
}
.ws-btn:hover { background: var(--ws-panel-3); }
.ws-btn-primary {
  background: var(--ws-accent-scan);
  color: #00131c;
  border-color: transparent;
  font-weight: 600;
}
.ws-btn-primary:hover { filter: brightness(1.08); }
.ws-btn-icon {
  width: 36px; height: 36px; border: 0; cursor: pointer;
  border-radius: 50%; background: transparent;
  color: var(--ws-text-2);
  display: inline-flex; align-items: center; justify-content: center;
}
.ws-btn-icon:hover { background: var(--ws-panel-2); color: var(--ws-text); }

/* Background grid */
.ws-grid-bg {
  background-image:
    linear-gradient(to right, var(--ws-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--ws-grid) 1px, transparent 1px);
  background-size: 22px 22px;
}

/* Animations */
@keyframes ws-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.ws-pulse { animation: ws-pulse 2.4s ease-in-out infinite; }

@keyframes ws-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@keyframes ws-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.ws-screen { animation: ws-in 0.28s cubic-bezier(0.2, 0.7, 0.2, 1); height: 100%; display: flex; flex-direction: column; }

@keyframes ws-blink { 50% { opacity: 0; } }

/* Annotation overlay */
.ws-annot {
  position: absolute; pointer-events: none;
  border: 1px dashed var(--ws-accent-focus);
  background: color-mix(in oklab, var(--ws-accent-focus) 8%, transparent);
  border-radius: 4px;
}
.ws-annot-label {
  position: absolute; pointer-events: none;
  font-family: var(--ws-f-mono);
  font-size: 9px;
  background: var(--ws-accent-focus); color: #fff;
  padding: 3px 6px; border-radius: 3px;
  letter-spacing: 0.04em; line-height: 1;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

</style>

  { id: 'gps-fine',      name: 'Fine location',       state: 'WORKS_DEGRADED',       note: 'background access denied · coarse only' },
  { id: 'baro',          name: 'Barometer',           state: 'WORKS_NATIVE',         note: 'floor estimate enabled' },
  { id: 'imu',           name: 'IMU motion',          state: 'WORKS_NATIVE',         note: 'spatial correlation enabled' },
  { id: 'pcap',          name: 'PCAP export',         state: 'FAILS',                note: 'not available without root' },
];

// ── Spatial / heatmap cells (synthesized) ────────────────────────
// 10×14 grid, each cell {x, y, rssi, anomaly}.
const HEATMAP = (() => {
  const cells = [];
  for (let y = 0; y < 10; y++) for (let x = 0; x < 14; x++) {
    const dx = x - 7, dy = y - 5;
    const d = Math.sqrt(dx*dx + dy*dy);
    const rssi = -42 - d * 4.6 + ((x*7+y*3)%5);
    const anomaly = (x === 11 && y >= 2 && y <= 4) ? 'high'
                  : (x === 3 && y === 7) ? 'medium' : null;
    cells.push({ x, y, rssi, anomaly });
  }
  return cells;
})();

// ── Live-feed tick (drives the dashboard sparklines / chips) ─────
function useLiveTick(running = true, periodMs = 1000) {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setT(p => p + 1), periodMs);
    return () => clearInterval(id);
  }, [running, periodMs]);
  return t;
}

// Smoothed time-series synthesizer.
function fakeSeries(seed, n = 60, base = -60, amp = 6) {
  const out = [];
  let v = base;
  for (let i = 0; i < n; i++) {
    const s = Math.sin((seed * 0.31 + i * 0.21)) * amp * 0.5;
    const r = ((Math.sin(seed * 13 + i * 7) + 1) / 2 - 0.5) * 2;
    v = v * 0.85 + (base + s + r) * 0.15;
    out.push(v);
  }
  return out;
}

// ── Sparkline ────────────────────────────────────────────────────
function Spark({ data, height = 28, color = 'var(--ws-accent-scan)', fill = true, lastDot = true }) {
  if (!data?.length) return null;
  let min = Infinity, max = -Infinity;
  for (const v of data) { if (v < min) min = v; if (v > max) max = v; }
  if (max - min < 1e-9) max = min + 1;
  const n = data.length, w = 100;
  const dx = w / (n - 1 || 1);
  const y = v => height - 2 - ((v - min) / (max - min)) * (height - 4);
  let d = `M 0 ${y(data[0]).toFixed(2)}`;
  for (let i = 1; i < n; i++) d += ` L ${(i*dx).toFixed(2)} ${y(data[i]).toFixed(2)}`;
  const area = `${d} L ${w} ${height} L 0 ${height} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none"
         style={{ width: '100%', height, display: 'block', overflow: 'visible', color }}>
      {fill && <path d={area} fill="currentColor" opacity="0.10" />}
      <path d={d} fill="none" stroke="currentColor" strokeWidth="1" vectorEffect="non-scaling-stroke" />
      {lastDot && (
        <circle cx={((n-1)*dx).toFixed(2)} cy={y(data[n-1]).toFixed(2)} r="1.8"
                fill="currentColor" vectorEffect="non-scaling-stroke" />
      )}
    </svg>
  );
}

  const c = lvl >= 3 ? 'var(--ws-rssi-strong)' : lvl === 2 ? 'var(--ws-rssi-moderate)' : 'var(--ws-rssi-weak)';

  );
}

// ── Spatial / radar variant ───────────────────────────────────────
function SessionSpatial({ live, setLive, onOpenAnomaly }) {
  // Place APs and BLE on a radar at a deterministic angle/radius from RSSI.
  const pts = React.useMemo(() => {
    const out = [];
    WIFI.forEach((w, i) => {
      const a = (i * 47 + 30) % 360;
      const r = Math.min(0.95, (w.rssi + 95) / 60);
      out.push({ kind: 'wifi', a, r, label: w.ssid, anomaly: w.anomaly });
    });
    BLE.forEach((b, i) => {
      const a = (i * 73 + 200) % 360;
      const r = Math.min(0.95, (b.rssi + 95) / 60);
      out.push({ kind: 'ble', a, r, label: b.name, anomaly: b.anomaly });
    });
    return out;
  }, []);
  const R = 130;

  return (
    <div className="ws-screen ws-scroll">
      <SessionHeader live={live} setLive={setLive} variant="spatial" />

      <div className="ws-card ws-grid-bg" style={{
        margin: '0 16px 12px', padding: 18,
        position: 'relative', overflow: 'hidden',
        background: 'var(--ws-panel)',
      }}>
        <svg viewBox={`-${R+18} -${R+18} ${(R+18)*2} ${(R+18)*2}`} style={{ display: 'block', width: '100%', height: 'auto' }}>
          {/* Sweep cone */}
          {live && (
            <g style={{ transformOrigin: '0 0', animation: 'ws-sweep 6s linear infinite' }}>
              <defs>
                <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0%" stopColor="var(--ws-accent-scan)" stopOpacity="0.0" />
                  <stop offset="100%" stopColor="var(--ws-accent-scan)" stopOpacity="0.35" />
                </linearGradient>
              </defs>
              <path d={`M0 0 L${R} 0 A${R} ${R} 0 0 0 ${R*0.5} ${-R*0.866} Z`} fill="url(#sweep)" />
            </g>
          )}
          {/* Rings */}
          {[0.25, 0.5, 0.75, 1].map(p => (
            <circle key={p} cx="0" cy="0" r={R * p} fill="none"
                    stroke="var(--ws-border)" strokeWidth="0.6" />
          ))}
          {/* Cross axes */}
          <line x1={-R} x2={R} y1="0" y2="0" stroke="var(--ws-border)" strokeWidth="0.5" />
          <line x1="0" x2="0" y1={-R} y2={R} stroke="var(--ws-border)" strokeWidth="0.5" />
          {/* Center "me" */}
          <circle cx="0" cy="0" r="4" fill="var(--ws-accent-scan)" />
          <circle cx="0" cy="0" r="9" fill="none" stroke="var(--ws-accent-scan)" strokeWidth="1" opacity="0.6" />

          {/* Points */}
          {pts.map((p, i) => {
            const x = Math.cos(p.a * Math.PI / 180) * R * p.r;
            const y = Math.sin(p.a * Math.PI / 180) * R * p.r;
            const c = p.anomaly
              ? `var(--ws-threat-${p.anomaly})`
              : p.kind === 'wifi' ? 'var(--ws-accent-scan)' : 'var(--ws-accent-focus)';
            return (
              <g key={i}>
                {p.anomaly && (
                  <circle cx={x} cy={y} r="6" fill={c} opacity="0.18" />
                )}
                <circle cx={x} cy={y} r={p.anomaly ? 3.6 : 2.4} fill={c} />
              </g>
            );
          })}

          {/* Distance rings labels */}
          {[0.5, 1].map(p => (
            <text key={p} x={R*p + 4} y="-4" fontFamily="var(--ws-f-mono)"
                  fontSize="7" fill="var(--ws-text-3)"
                  style={{ letterSpacing: 0.5 }}>
              {Math.round((1-p) * 60 + 35)}dB
            </text>
          ))}
        </svg>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
          <span className="ws-meta">proximity · rssi-derived</span>
          <span className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-2)' }}>
            wifi {WIFI.length} · ble {BLE.length}
          </span>
        </div>
      </div>

      <div style={{ padding: '0 16px 12px', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        <span className="ws-chip" style={{ background: 'color-mix(in oklab, var(--ws-accent-scan) 18%, var(--ws-panel-2))' }}>
          <span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-accent-scan)' }} />
          wifi
        </span>
        <span className="ws-chip" style={{ background: 'color-mix(in oklab, var(--ws-accent-focus) 18%, var(--ws-panel-2))' }}>
          <span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-accent-focus)' }} />
          ble
        </span>
        <span className="ws-chip" style={{ background: 'color-mix(in oklab, var(--ws-threat-high) 18%, var(--ws-panel-2))' }}>
          <span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-threat-high)' }} />
          anomalous
        </span>
      </div>

      <div className="ws-card" style={{ margin: '0 16px 16px', padding: '10px 14px' }}>
        <div className="ws-meta" style={{ marginBottom: 6 }}>.nyx</div>
        <div className="ws-mono" style={{ fontSize: 12, color: 'var(--ws-text)', lineHeight: 1.45 }}>
          {ANOMALIES[0].summary}
        </div>

}

// ── V3: Pro · dense heatmap (day × hour) ─────────────────────────
function HistoryPro({ onOpenAnomaly }) {
  const days = ['mon','tue','wed','thu','fri','sat','sun'];
  // Synthesize per-cell counts from session data.
  const grid = React.useMemo(() => {
    const m = Array.from({ length: 7 }, () => Array(24).fill(0));
    SESSIONS.forEach(s => {
      const day = ({Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6})[s.t.split(' ')[0]] ?? 0;
      const hr = parseInt(s.t.split(' ')[1].slice(0,2), 10);
      m[day][hr] += s.an + 1;
    });
    // Sprinkle filler
    for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) {
      const k = (d * 37 + h * 11) % 11;
      if (k > 8 && m[d][h] === 0) m[d][h] = 1;
    }
    return m;
  }, []);
  return (
    <div className="ws-screen ws-scroll">
      <HistHeader subtitle="density · 7 days × 24h · all anomaly levels" />
      <div className="ws-card" style={{ margin: '0 16px 12px', padding: 14 }}>
        <div className="ws-meta" style={{ marginBottom: 12 }}>density</div>
        <div style={{ display: 'grid', gridTemplateColumns: '22px repeat(24, 1fr)', gap: 2 }}>
          {days.map((d, di) => (
            <React.Fragment key={d}>
              <div className="ws-mono" style={{
                fontSize: 9, color: 'var(--ws-text-2)',
                display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
                paddingRight: 4,
              }}>{d}</div>
              {grid[di].map((v, h) => (

<script type="text/babel">
// screen-detail.jsx — Anomaly detail bottom-sheet + map/diag screens

// ── Anomaly Detail (bottom sheet overlay) ─────────────────────────
function AnomalyDetail({ anomaly, onClose, tier }) {
  if (!anomaly) return null;
  return (
    <div onClick={onClose} style={{
      position: 'absolute', inset: 0, zIndex: 30,
      background: 'rgba(0,0,0,0.55)',
      display: 'flex', alignItems: 'flex-end',
      animation: 'ws-in 0.18s',
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: '100%', background: 'var(--ws-canvas)',
        borderRadius: '20px 20px 0 0',
        maxHeight: '88%', display: 'flex', flexDirection: 'column',
        animation: 'ws-in 0.24s',
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', padding: '10px 0 6px' }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: 'var(--ws-border-2)' }} />
        </div>
        <div className="ws-scroll" style={{ padding: '0 16px 22px', overflowY: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <AnomalyPill level={anomaly.level}>{anomaly.level}</AnomalyPill>
            <button onClick={onClose} className="ws-btn-icon"><I.Close /></button>
          </div>
          <div className="ws-display ws-h" style={{
            fontSize: 20, fontWeight: 500, lineHeight: 1.25, marginTop: 8,
          }}>{anomaly.title}</div>
          <div className="ws-mono" style={{ fontSize: 11, color: 'var(--ws-text-2)', marginTop: 6 }}>
            {anomaly.id} · {anomaly.t} · {anomaly.signals.map(s => s.toUpperCase()).join(' + ')}
          </div>

          {/* .nyx interpretation */}
          <div className="ws-card" style={{ padding: '14px', marginTop: 14,
            borderLeft: `3px solid var(--ws-threat-${anomaly.level})` }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
              <NyxAvatar size={24} />
              <div>
                <div className="ws-meta" style={{ marginBottom: 4 }}>.nyx · interpretation</div>
                <div style={{ fontSize: 13, color: 'var(--ws-text)', lineHeight: 1.5 }}>
                  {anomaly.summary}
                </div>
              </div>
            </div>
          </div>

          {/* Reasons */}
          {tier !== 'newbie' && (
            <div className="ws-card" style={{ marginTop: 12, padding: '12px 14px' }}>
              <div className="ws-meta" style={{ marginBottom: 8 }}>reasons (heuristic)</div>
              {anomaly.reasons.map((r, i) => (
                <div key={i} style={{
                  display: 'flex', gap: 8, padding: '5px 0',
                  borderBottom: i < anomaly.reasons.length - 1 ? '1px dashed var(--ws-border)' : 'none',
                }}>
                  <span className="ws-mono" style={{ fontSize: 9.5, color: 'var(--ws-accent-scan)', width: 22, flexShrink: 0 }}>
                    R{i+1}
                  </span>
                  <span style={{ fontSize: 12, color: 'var(--ws-text)', lineHeight: 1.4 }}>{r}</span>
                </div>
              ))}
            </div>
          )}

          {/* Recurrence */}
          <div className="ws-card" style={{ marginTop: 12, padding: '12px 14px' }}>
            <div className="ws-meta" style={{ marginBottom: 4 }}>recurrence</div>
            <div className="ws-mono" style={{ fontSize: 12, color: 'var(--ws-text)' }}>{anomaly.recurrence}</div>
          </div>

          {/* Investigation */}
          <div className="ws-card" style={{ marginTop: 12, padding: '12px 14px', background: 'var(--ws-panel-2)' }}>
            <div className="ws-meta" style={{ marginBottom: 4 }}>recommendation</div>
            <div style={{ fontSize: 13, color: 'var(--ws-text)', lineHeight: 1.5 }}>{anomaly.investigation}</div>
            <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-3)', marginTop: 8 }}>
              · no actor identification · no intent attribution
            </div>
          </div>

          {/* Pro: raw JSON */}
          {tier === 'pro' && (
            <div style={{
              marginTop: 12, padding: '12px 14px',
              background: 'var(--ws-console)', border: '1px solid var(--ws-border)',
              borderRadius: 'var(--ws-r-md)',
            }}>
              <pre className="ws-mono" style={{
                margin: 0, fontSize: 10, color: '#a5b4c0', lineHeight: 1.5,
                whiteSpace: 'pre-wrap', wordBreak: 'break-word',
              }}>{JSON.stringify({
                id: anomaly.id, level: anomaly.level, t: anomaly.t,
                signals: anomaly.signals, reasons: anomaly.reasons,
                recurrence: anomaly.recurrence,
                session: SESSION.id, capability: SESSION.capability,
              }, null, 2)}</pre>
            </div>
          )}

          <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
            <button className="ws-btn" style={{ flex: 1 }}>
              {tier === 'pro' ? 'Export JSON' : 'Share report'}
            </button>
            <button className="ws-btn ws-btn-primary" style={{ flex: 1 }}>Mark reviewed</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Map screen (all 4 variants share same base) ──────────────────
function ScreenMap() {
  return (
    <div className="ws-screen ws-scroll">
      <div style={{ padding: '8px 16px 12px' }}>
        <div className="ws-display ws-h" style={{ fontSize: 17, fontWeight: 500 }}>Spatial Map</div>
        <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-2)' }}>
          rssi heatmap · {HEATMAP.length} cells · indoor
        </div>
      </div>
      <div className="ws-card ws-grid-bg" style={{
        margin: '0 16px 12px', padding: 14, position: 'relative',
      }}>
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(14, 1fr)',
          gap: 2,
        }}>
          {HEATMAP.map((c, i) => {
            const norm = Math.min(1, Math.max(0, (c.rssi + 95) / 55));
            const col = c.anomaly
              ? `var(--ws-threat-${c.anomaly})`
              : norm > 0.7 ? 'var(--ws-rssi-strong)'
              : norm > 0.4 ? 'var(--ws-rssi-moderate)'
              : 'var(--ws-rssi-weak)';
            return (
              <div key={i} style={{
                aspectRatio: '1', borderRadius: 2,
                background: col,
                opacity: c.anomaly ? 0.9 : 0.15 + norm * 0.65,
              }} title={`${c.rssi}dBm ${c.anomaly || ''}`} />
            );
          })}
        </div>
        <div className="ws-mono" style={{
          display: 'flex', justifyContent: 'space-between',
          marginTop: 10, fontSize: 9, color: 'var(--ws-text-3)',
        }}>
          <span>−95 dBm</span><span>−42 dBm</span>
        </div>
      </div>
      <div style={{ padding: '0 16px 12px', display: 'flex', gap: 8 }}>
        <span className="ws-chip"><span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-rssi-strong)' }} />strong</span>
        <span className="ws-chip"><span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-rssi-moderate)' }} />moderate</span>
        <span className="ws-chip"><span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-rssi-weak)' }} />weak</span>
        <span className="ws-chip"><span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--ws-threat-high)' }} />anomaly</span>
      </div>
      <div className="ws-card" style={{ margin: '0 16px 16px', padding: '12px 14px' }}>
        <div className="ws-meta" style={{ marginBottom: 6 }}>.nyx</div>
        <div className="ws-mono" style={{ fontSize: 12, color: 'var(--ws-text)', lineHeight: 1.45 }}>
          Strongest RSSI near center (AP location estimate). Anomalous cells clustered NE corner
          — likely origin zone for suspicious open SSIDs observed this session.
        </div>
        <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-3)', marginTop: 6 }}>
          · rssi-derived · not confirmed location · needs additional sessions
        </div>
      </div>
    </div>
  );
}

// ── Diagnostics / Capability screen ──────────────────────────────
function ScreenDiag() {
  const stateColor = {
    WORKS_NATIVE: 'var(--ws-threat-low)',
    WORKS_ADB: 'var(--ws-accent-focus)',
    WORKS_ADB_ENHANCED: 'var(--ws-accent-scan)',
    WORKS_DEGRADED: 'var(--ws-threat-medium)',
    FAILS: 'var(--ws-threat-critical)',
    UNTESTED: 'var(--ws-text-3)',
  };
  return (
    <div className="ws-screen ws-scroll">
      <div style={{ padding: '8px 16px 12px' }}>
        <div className="ws-display ws-h" style={{ fontSize: 17, fontWeight: 500 }}>Diagnostics</div>
        <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-2)' }}>
          capability manifest · {SESSION.device}
        </div>
      </div>

      <div className="ws-card" style={{ margin: '0 16px 12px', padding: '14px' }}>
        <div className="ws-meta" style={{ marginBottom: 6 }}>session</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {[
            ['device', SESSION.device.split(' · ')[0]],
            ['os', SESSION.device.split(' · ')[1]],
            ['mode', SESSION.capability],
            ['session', SESSION.id],
          ].map(([k, v]) => (
            <div key={k}>
              <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-3)' }}>{k}</div>
              <div className="ws-mono ws-h" style={{ fontSize: 12, marginTop: 2 }}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="ws-card" style={{ margin: '0 16px 12px', overflow: 'hidden' }}>
        <div style={{
          padding: '10px 14px', borderBottom: '1px solid var(--ws-border)',
          display: 'flex', justifyContent: 'space-between',
        }}>
          <span className="ws-meta">capability manifest</span>
          <span className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-2)' }}>
            {CAPABILITY.length} features
          </span>
        </div>
        {CAPABILITY.map((c, i) => (
          <div key={c.id} style={{
            display: 'grid', gridTemplateColumns: '1fr auto',
            padding: '10px 14px', gap: 10, alignItems: 'center',
            borderBottom: i < CAPABILITY.length - 1 ? '1px solid var(--ws-border)' : 'none',
          }}>
            <div>
              <div style={{ fontSize: 13, color: 'var(--ws-text-h)' }}>{c.name}</div>
              <div className="ws-mono" style={{ fontSize: 10, color: 'var(--ws-text-2)', marginTop: 2 }}>{c.note}</div>
            </div>
            <span className="ws-mono" style={{
              fontSize: 9, padding: '3px 8px', borderRadius: 999,
              background: `color-mix(in oklab, ${stateColor[c.state]} 16%, transparent)`,
              color: stateColor[c.state],
              border: `1px solid color-mix(in oklab, ${stateColor[c.state]} 30%, transparent)`,
              letterSpacing: '0.06em', fontWeight: 600, whiteSpace: 'nowrap',
            }}>{c.state}</span>
          </div>
        ))}
      </div>

      <div style={{ padding: '0 16px 18px', display: 'flex', gap: 8 }}>
        <button className="ws-btn" style={{ flex: 1 }}>Run self-test</button>
        <button className="ws-btn" style={{ flex: 1 }}>Export manifest</button>
      </div>
    </div>
  );
}

Object.assign(window, { AnomalyDetail, ScreenMap, ScreenDiag });

</script>

    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}

    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    if (window.parent === window) setOpen(true);
    const onMsg = (e) => {
      if (e.source !== window.parent) return;
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "theme": "dark",
  "nav": "command",
  "sessionView": "newbie",
  "historyView": "newbie",
  "showChrome": true,
  "showAnnotations": false
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('session');
  const [live, setLive] = React.useState(true);
  const [detail, setDetail] = React.useState(null);

  const theme = t.theme;
  const navVariant = t.nav;

  const sessionVar = SESSION_VARIANTS.find(v => v.id === t.sessionView) || SESSION_VARIANTS[0];
  const historyVar = HISTORY_VARIANTS.find(v => v.id === t.historyView) || HISTORY_VARIANTS[0];

  const openAnomaly = (a) => setDetail(a);
  const closeAnomaly = () => setDetail(null);

  const renderScreen = () => {
    const SV = sessionVar.Component;
    const HV = historyVar.Component;
    switch (screen) {
      case 'session': return <SV live={live} setLive={setLive} onOpenAnomaly={openAnomaly} />;
      case 'history': return <HV onOpenAnomaly={openAnomaly} />;
      case 'map':     return <ScreenMap />;
      case 'diag':    return <ScreenDiag />;
      default:        return <SV live={live} setLive={setLive} onOpenAnomaly={openAnomaly} />;
    }
  };

  return (
    <div className="phone-wrap" data-theme={theme}>
      <div className="ws-app">
        <StatusBar time="19:42" show={t.showChrome} />
        {navVariant === 'tabs' && <NavTop screen={screen} setScreen={setScreen} />}
        {navVariant === 'rail' && <NavRail screen={screen} setScreen={setScreen} />}
        <div style={{
          flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column',
          marginLeft: navVariant === 'rail' ? 60 : 0,
          position: 'relative',
        }}>
          {renderScreen()}
        </div>
        {navVariant === 'bottom'  && <NavBottom screen={screen} setScreen={setScreen} />}
        {navVariant === 'command' && <NavCmd screen={screen} setScreen={setScreen} />}
        <NavHandle show={t.showChrome} />
        {detail && <AnomalyDetail anomaly={detail} onClose={closeAnomaly} tier={t.sessionView} />}
      </div>

      <TweaksPanel title="wscan+ Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme}
          options={['dark', 'light']}
          onChange={v => setTweak('theme', v)} />
        <TweakSection label="Navigation" />
        <TweakRadio label="Nav style" value={t.nav}
          options={[
            { value: 'bottom',  label: 'Bottom' },
            { value: 'tabs',    label: 'Top' },
            { value: 'rail',    label: 'Rail' },
            { value: 'command', label: 'FAB' },
          ]}
          onChange={v => setTweak('nav', v)} />
        <TweakSection label="Session view" />
        <TweakSelect label="Presentation tier" value={t.sessionView}
          options={SESSION_VARIANTS.map(v => ({ value: v.id, label: v.label }))}
          onChange={v => setTweak('sessionView', v)} />
        <TweakSection label="History view" />
        <TweakSelect label="Variant" value={t.historyView}
          options={HISTORY_VARIANTS.map(v => ({ value: v.id, label: v.label }))}
          onChange={v => setTweak('historyView', v)} />
        <TweakSection label="Chrome" />
        <TweakToggle label="Status bar + handle" value={t.showChrome}
          onChange={v => setTweak('showChrome', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
